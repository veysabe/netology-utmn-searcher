openapi: 3.0.3
info:
  title: Поиск по PDF-документам
  description: >
    HTTP-сервис полнотекстового поиска по PDF-файлам.
    Сервис собирает индекс из указанных в конфигурации директорий,
    строит обратный индекс и поддерживает поиск по текстовому запросу.
    Ответ содержит не более 10 самых релевантных документов.
    Любой путь, кроме перечисленных ниже, возвращает 404
    с телом {"error": "not found"}.
  version: 1.0.0
  contact:
    name: Netology UTMN Searcher

servers:
  - url: http://127.0.0.1:8008
    description: Локальный сервер

paths:
  /search:
    get:
      summary: Поиск документов по текстовому запросу
      description: >
        Возвращает список PDF-документов, отсортированный по релевантности.
        Используется обратный индекс (inverted index) для оценки
        соответствия документа ключевым словам.
      tags:
        - search
      parameters:
        - name: q
          in: query
          description: Текстовый запрос для поиска (ключевые слова)
          required: true
          schema:
            type: string
          example: "математика анализ"
      responses:
        "200":
          description: Успешный поиск
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              examples:
                default:
                  value:
                    query: "математика анализ"
                    results:
                      - id: 1
                        path: /path/to/docs/example.pdf
        "400":
          description: Запрос не содержит поискового запроса
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                default:
                  value:
                    error: "empty query"
  /health:
    get:
      summary: Состояние сервиса и хранилища
      description: >
        Возвращает режим хранилища (mongodb или file), признак отката
        на файловый кэш, причину отката и счётчики индекса.
      tags:
        - health
      responses:
        "200":
          description: Сервис работает
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                default:
                  value:
                    status: ok
                    storage: mongodb
                    fallback: false
                    reason: null
                    documents: 4
                    unique_words: 54

components:
  schemas:
    SearchResponse:
      type: object
      description: Ответ сервера с результатами поиска
      required:
        - query
        - results
      properties:
        query:
          type: string
          description: Введённый поисковый запрос
          example: "математика анализ"
        results:
          type: array
          description: Список найденных документов, отсортированных по убыванию релевантности
          items:
            $ref: "#/components/schemas/DocumentResult"
    DocumentResult:
      type: object
      description: Результат поиска — один документ
      properties:
        id:
          type: integer
          description: Уникальный идентификатор документа (порядковый номер)
          example: 1
        path:
          type: string
          description: Абсолютный путь к PDF-файлу на диске
          example: "/path/to/docs/example.pdf"
    ErrorResponse:
      type: object
      description: Ответ с ошибкой
      required:
        - error
      properties:
        error:
          type: string
          description: Текст ошибки
          example: "not found"
    HealthResponse:
      type: object
      description: Состояние сервиса
      required:
        - status
        - storage
        - fallback
        - documents
        - unique_words
      properties:
        status:
          type: string
          example: "ok"
        storage:
          type: string
          description: Режим хранилища — mongodb или file
          example: "mongodb"
        fallback:
          type: boolean
          description: true, если MongoDB недоступна и сервис работает на файловом кэше
          example: false
        reason:
          type: string
          nullable: true
          description: Причина отката на файловый кэш
          example: null
        documents:
          type: integer
          description: Количество найденных PDF-документов
          example: 4
        unique_words:
          type: integer
          description: Количество уникальных слов в индексе
          example: 54
